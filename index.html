  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      document.querySelectorAll('#btn-logout, #btn-logout-mobile').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          AUTH.logout();
          location.reload();
        });
      });

      const grid = document.getElementById('posts-grid');
      const emptyState = document.getElementById('empty-state');
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

      try {
        const posts = await PostStore.getAll();

        if (posts.length === 0) {
          emptyState.style.display = 'block';
          return;
        }

        posts.forEach((post, i) => {
          const date = new Date(post.createdAt);
          const dateStr = `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
          const desc = post.description || stripHtml(post.content || '').substring(0, 150) + '...';
          const coverHtml = post.coverUrl
            ? `<img src="${post.coverUrl}" alt="${escapeHtml(post.title)}" loading="${i < 4 ? 'eager' : 'lazy'}" class="post-image">`
            : `<div class="post-image post-image-placeholder"></div>`;

          const li = document.createElement('li');
          li.innerHTML = `
            <a href="post.html?id=${post.id}" class="post-card">
              ${coverHtml}
              <h4 class="post-title">${escapeHtml(post.title)}</h4>
              <p class="post-description">${escapeHtml(desc)}</p>
              <p class="post-date"><time datetime="${post.createdAt}">${dateStr}</time></p>
            </a>`;
          grid.appendChild(li);
        });
      } catch (e) {
        emptyState.textContent = '글을 불러오는 중 오류가 발생했습니다.';
        emptyState.style.display = 'block';
      }

      function stripHtml(html) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || '';
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }
    });
  </script>
