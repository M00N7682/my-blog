  <script src="script.js"></script>
  <script src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      document.querySelectorAll('#btn-logout, #btn-logout-mobile').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          AUTH.logout();
          location.reload();
        });
      });

      const grid = document.getElementById('members-grid');
      const emptyState = document.getElementById('empty-state');
      const API_BASE = 'https://my-blog-api-production-69ce.up.railway.app';

      try {
        const res = await fetch(`${API_BASE}/api/members`);
        const members = await res.json();

        if (!members.length) {
          emptyState.style.display = 'block';
          return;
        }

        members.forEach(() => {
          const card = document.createElement('div');
          card.className = 'member-card';
          card.innerHTML = `
            <div class="member-avatar"></div>
            <h3 class="member-name">&nbsp;</h3>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        emptyState.textContent = '멤버 정보를 불러오는 중 오류가 발생했습니다.';
        emptyState.style.display = 'block';
      }
    });
  </script>
