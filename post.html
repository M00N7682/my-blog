<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header>
    <nav>
      <div class="app-container nav-inner">
        <a href="/" aria-label="Home" class="logo-link">
          <svg width="36" height="36" viewBox="0 0 1080 1080" fill="none">
            <circle cx="540" cy="540" r="400" fill="currentColor"></circle>
          </svg>
        </a>
        <div class="nav-right">
          <a href="/" class="nav-link active">Blog</a>
          <a href="#talks" class="nav-link">Talks</a>
          <a href="#about" class="nav-link">About</a>
          <a href="login.html" class="nav-link guest-only">Login</a>
          <a href="#" class="nav-link auth-only" id="btn-logout">Logout</a>
          <div class="theme-switcher">
            <button class="theme-button active" data-theme="auto" aria-label="Auto Theme" title="System preference">
              <svg width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="m14.3 16l-.7-2h-3.2l-.7 2H7.8L11 7h2l3.2 9zM20 8.69V4h-4.69L12 .69L8.69 4H4v4.69L.69 12L4 15.31V20h4.69L12 23.31L15.31 20H20v-4.69L23.31 12zm-9.15 3.96h2.3L12 9z"></path></svg>
            </button>
            <button class="theme-button" data-theme="light" aria-label="Light Theme" title="Light theme">
              <svg width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="m3.55 19.09l1.41 1.41l1.8-1.79l-1.42-1.42M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6s6-2.69 6-6c0-3.32-2.69-6-6-6m8 7h3v-2h-3m-2.76 7.71l1.8 1.79l1.41-1.41l-1.79-1.8M20.45 5l-1.41-1.4l-1.8 1.79l1.42 1.42M13 1h-2v3h2M6.76 5.39L4.96 3.6L3.55 5l1.79 1.81zM1 13h3v-2H1m12 9h-2v3h2"></path></svg>
            </button>
            <button class="theme-button" data-theme="dark" aria-label="Dark Theme" title="Dark theme">
              <svg width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="m17.75 4.09l-2.53 1.94l.91 3.06l-2.63-1.81l-2.63 1.81l.91-3.06l-2.53-1.94L12.44 4l1.06-3l1.06 3zm3.5 6.91l-1.64 1.25l.59 1.98l-1.7-1.17l-1.7 1.17l.59-1.98L15.75 11l2.06-.05L18.5 9l.69 1.95zm-2.28 4.95c.83-.08 1.72 1.1 1.19 1.85c-.32.45-.66.87-1.08 1.27C15.17 23 8.84 23 4.94 19.07c-3.91-3.9-3.91-10.24 0-14.14c.4-.4.82-.76 1.27-1.08c.75-.53 1.93.36 1.85 1.19c-.27 2.86.69 5.83 2.89 8.02a9.96 9.96 0 0 0 8.02 2.89m-1.64 2.02a12.08 12.08 0 0 1-7.8-3.47c-2.17-2.19-3.33-5-3.49-7.82c-2.81 3.14-2.7 7.96.31 10.98c3.02 3.01 7.84 3.12 10.98.31"></path></svg>
            </button>
          </div>
        </div>
        <button class="mobile-menu-btn" id="nav-open-btn" aria-label="Open navigation menu">
          <svg width="32" height="32" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"></path></svg>
        </button>
        <div class="mobile-menu" id="mobile-menu">
          <button id="nav-close-btn" class="mobile-close-btn" aria-label="Close navigation menu">
            <svg width="32" height="32" viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12z"></path></svg>
          </button>
          <div class="mobile-menu-links">
            <a href="/" class="mobile-link active">Blog</a>
            <a href="#talks" class="mobile-link">Talks</a>
            <a href="#about" class="mobile-link">About</a>
            <a href="login.html" class="mobile-link guest-only">Login</a>
            <a href="#" class="mobile-link auth-only" id="btn-logout-mobile">Logout</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <div class="page-wrapper">
    <article class="post-detail-container app-container" id="post-detail">
      <div class="post-detail-header">
        <h1 class="post-detail-title" id="detail-title"></h1>
        <p class="post-detail-date" id="detail-date"></p>
        <div class="post-detail-actions admin-only" id="detail-actions">
          <button class="btn-edit" id="btn-edit">수정</button>
          <button class="btn-delete" id="btn-delete">삭제</button>
        </div>
      </div>
      <img id="detail-cover" class="post-detail-cover" alt="" style="display:none;">
      <div class="post-detail-body" id="detail-body"></div>
    </article>
  </div>

  <footer>
    <div class="app-container footer-inner">
      <div class="footer-left">
        <a href="/" class="logo-link" aria-label="Home">
          <svg width="36" height="36" viewBox="0 0 1080 1080" fill="none">
            <circle cx="540" cy="540" r="400" fill="currentColor"></circle>
          </svg>
        </a>
        <div class="social-links">
          <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="GitHub">
            <svg class="social-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5c.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34c-.46-1.16-1.11-1.47-1.11-1.47c-.91-.62.07-.6.07-.6c1 .07 1.53 1.03 1.53 1.03c.87 1.52 2.34 1.07 2.91.83c.09-.65.35-1.09.63-1.34c-2.22-.25-4.55-1.11-4.55-4.92c0-1.11.38-2 1.03-2.71c-.1-.25-.45-1.29.1-2.64c0 0 .84-.27 2.75 1.02c.79-.22 1.65-.33 2.5-.33s1.71.11 2.5.33c1.91-1.29 2.75-1.02 2.75-1.02c.55 1.35.2 2.39.1 2.64c.65.71 1.03 1.6 1.03 2.71c0 3.82-2.34 4.66-4.57 4.91c.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2"></path></svg>
          </a>
          <a href="#rss" class="social-link" aria-label="RSS Feed">
            <svg class="social-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M6.18 15.64a2.18 2.18 0 0 1 2.18 2.18C8.36 19 7.38 20 6.18 20C5 20 4 19 4 17.82a2.18 2.18 0 0 1 2.18-2.18M4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27zm0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93z"></path></svg>
          </a>
        </div>
      </div>
      <div class="footer-right">
        <h3 class="footer-heading">Links</h3>
        <div class="footer-links">
          <a class="footer-link" href="/">Blog</a>
          <a class="footer-link" href="#talks">Talks</a>
          <a class="footer-link" href="#about">About</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="auth.js"></script>
  <script src="store.js"></script>
  <script>
    document.querySelectorAll('#btn-logout, #btn-logout-mobile').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        AUTH.logout();
        location.href = '/';
      });
    });
  </script>
  <script src="posts.js"></script>
</body>
</html>
